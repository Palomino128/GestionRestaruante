<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Empleado - Sabor Peruano</title>
</head>
<body>
<section>
    <div class="container py-5">
        <h1><i class="fas fa-concierge-bell"></i> Dashboard Empleado</h1>
        <p>Hola <strong th:text="${session.usuarioLogeado != null ? session.usuarioLogeado.nombres : 'Empleado'}"></strong>.</p>

        <div class="mt-4">
            <a class="btn btn-outline-primary" th:href="@{/empleado/pedidos}">Ver pedidos</a>
            <a class="btn btn-outline-secondary ms-2" th:href="@{/logout}">Cerrar sesión</a>
        </div>

        <hr/>

        <p class="text-muted mt-3">Aquí puedes listar pedidos, marcar como preparados, etc. (implementa según tu lógica).</p>
    </div>
</section>
</body>
</html>
