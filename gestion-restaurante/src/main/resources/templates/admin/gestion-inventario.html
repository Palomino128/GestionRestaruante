<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout (~{::body})">
<head>
    <title>Gestión de Inventario - Sabor Peruano</title>
</head>
<body>

<div class="container-fluid">
    <div class="row">
               <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar px-2">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}" th:classappend="${request.requestURI.startsWith('/admin/dashboard')} ? ' active' : ''">
                            <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/platos}" th:classappend="${request.requestURI.startsWith('/admin/platos')} ? ' active' : ''">
                            <i class="fas fa-utensils me-2"></i> Gestión de Platos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/inventario}" th:classappend="${request.requestURI.startsWith('/admin/inventario')} ? ' active' : ''">
                            <i class="fas fa-boxes me-2"></i> Gestión de Inventario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/sucursales}" th:classappend="${request.requestURI.startsWith('/admin/sucursales')} ? ' active' : ''">
                            <i class="fas fa-store me-2"></i> Gestión de Sucursales
                        </a>
                    </li>
<!-- Botón de Gestión de Pedidos -->
<div class="row mt-4">
    <div class="col-md-12">
        <a class="btn btn-outline-primary" th:href="@{/admin/pedidos}">
            <i class="fas fa-shopping-cart me-1"></i> Gestionar Pedidos
        </a>
    </div>
</div>


                    <li class="nav-item mt-3">
                        <a class="nav-link text-danger" th:href="@{/logout}">
                            <i class="fas fa-power-off me-2"></i> Cerrar sesión
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Contenido Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2">Gestión de Inventario</h1>
                <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#formNuevoInventario">
                    <i class="fas fa-plus me-2"></i>Agregar Insumo
                </button>
            </div>

            <!-- Alertas -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- Formulario Nuevo Insumo -->
            <div class="collapse mb-4" id="formNuevoInventario">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/admin/insumos}" th:object="${nuevoInsumo}" method="post">
                            <input type="hidden" th:field="*{estado}" value="true" />
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label>Nombre</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" required/>
                                </div>
                                <div class="col-md-4">
                                    <label>Descripción</label>
                                    <input type="text" class="form-control" th:field="*{descripcion}"/>
                                </div>
                                <div class="col-md-2">
                                    <label>Stock</label>
                                    <input type="number" class="form-control" th:field="*{stock}" min="0"/>
                                </div>
                                <div class="col-md-2">
                                    <label>Unidad</label>
                                    <input type="text" class="form-control" th:field="*{unidad}"/>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-success">Guardar Insumo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Botones de Exportación -->
            <div class="mb-3">
                <h5>Exportar Reportes:</h5>
                <a th:href="@{/admin/reportes/inventario/pdf}" class="btn btn-danger me-2">
                    <i class="fas fa-file-pdf"></i> PDF Inventario
                </a>
                <a th:href="@{/admin/reportes/inventario/excel}" class="btn btn-success me-2">
                    <i class="fas fa-file-excel"></i> Excel Inventario
                </a>
            </div>

            <!-- Tabla de Insumos -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Stock</th>
                                    <th>Unidad</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
<tbody>
    <tr th:each="insumo : ${insumos}">
        <td th:text="${insumo.id}">1</td>
        <td th:text="${insumo.nombre}">Arroz</td>
        <td th:text="${insumo.descripcion}">Arroz extra</td>
        <td th:text="${insumo.stock}">10</td>
        <td th:text="${insumo.unidad}">kg</td>
        <td>
            <span th:if="${insumo.estado}" class="badge bg-success">Activo</span>
            <span th:unless="${insumo.estado}" class="badge bg-danger">Agotado</span>
        </td>
        <td>
            <!-- Form actualizar stock -->
<form th:action="@{'/admin/insumos/actualizar/' + ${insumo.id}}" method="post" class="d-flex me-1">
    <input type="number" name="cantidad" th:value="${insumo.stock}" min="0" class="form-control me-1"/>
    <button type="submit" class="btn btn-sm btn-primary">Actualizar</button>
</form>

<!-- Form marcar como agotado -->
<form th:action="@{'/admin/insumos/agotado/' + ${insumo.id}}" method="post" class="d-flex mt-1">
    <button type="submit" class="btn btn-sm btn-danger">Marcar como agotado</button>
</form>

<!-- Form marcar como disponible -->
<form th:action="@{'/admin/insumos/disponible/' + ${insumo.id}}" method="post" class="d-flex mt-1">
    <button type="submit" class="btn btn-sm btn-success">Marcar como disponible</button>
</form>
<!-- Form eliminar insumo -->
<form th:action="@{'/admin/insumos/eliminar/' + ${insumo.id}}" method="post" class="d-flex mt-1">
    <button type="submit" class="btn btn-sm btn-warning">Eliminar</button>
</form>


        </td>
    </tr>
</tbody>

                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

</body>
</html>
