<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout (~{::body})">

<head>
    <title>Editar Plato - Sabor Peruano</title>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar px-2">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/platos}">
                            <i class="fas fa-utensils me-2"></i> Gestión de Platos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/inventario}">
                            <i class="fas fa-boxes me-2"></i> Gestión de Inventario
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/sucursales}">
                            <i class="fas fa-store me-2"></i> Gestión de Sucursales
                        </a>
                    </li>

                    <li class="nav-item mt-3">
                        <a class="nav-link text-danger" th:href="@{/logout}">
                            <i class="fas fa-power-off me-2"></i> Cerrar sesión
                        </a>
                    </li>

                </ul>
            </div>
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2">Editar Plato</h1>

                <a th:href="@{/admin/platos}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i> Volver
                </a>
            </div>

            <!-- Alertas -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form th:action="@{'/admin/platos/editar/' + ${plato.id}}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Nombre del Plato</label>
                            <input type="text" class="form-control" name="nombre"
                                   th:value="${plato.nombre}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" rows="4" name="descripcion" required
                                      th:text="${plato.descripcion}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" step="0.01" class="form-control" name="precio"
                                   th:value="${plato.precio}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL de Imagen</label>
                            <input type="text" class="form-control" name="imagen"
                                   th:value="${plato.imagen}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" name="categoria.id" required>

                                <option value="">Seleccione</option>

                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre}"
                                        th:selected="${plato.categoria.id == cat.id}">
                                </option>

                            </select>
                        </div>

                        <!-- Estado (activo/inactivo) -->
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                <option th:value="true" th:selected="${plato.estado}">Activo</option>
                                <option th:value="false" th:selected="${!plato.estado}">Inactivo</option>
                            </select>
                        </div>

                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-save me-2"></i> Guardar Cambios
                        </button>

                    </form>

                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
