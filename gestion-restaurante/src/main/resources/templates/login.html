<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Sabor Peruano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow" style="width: 380px;">
        <div class="card-header bg-danger text-white text-center">
            <h4>Iniciar Sesión</h4>
        </div>

        <div class="card-body">

            <!-- MENSAJE DE ERROR -->
            <div th:if="${error}" class="alert alert-danger text-center">
                <span th:text="${error}"></span>
            </div>

            <!-- MENSAJE DE ÉXITO (por ejemplo, después de registrarse o logout) -->
            <div th:if="${success}" class="alert alert-success text-center">
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" name="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" name="password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select class="form-select" name="rol">
                        <option value="ADMIN">Administrador</option>
                        <option value="EMPLEADO">Empleado</option>
                        <option value="CLIENTE" selected>Cliente</option>
                    </select>
                </div>

                <button class="btn btn-danger w-100" type="submit">Ingresar</button>

                <!-- ENLACE PARA REGISTRO DE CLIENTE -->
                <p class="text-center mt-3 mb-0">
                    ¿Aún no tienes cuenta?
                    <a href="/registro">Regístrate como cliente</a>
                </p>

            </form>
        </div>
    </div>
</div>

</body>
</html>
