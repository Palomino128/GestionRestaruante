<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras - Sabor Peruano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1><i class="fas fa-shopping-cart"></i> Carrito de Compras</h1>
    <hr>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Plato</th>
            <th>Precio (S/)</th>
            <th>Subtotal (S/)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${carrito}">
            <td th:text="${item.nombre}">Plato</td>
            <td th:text="${#numbers.formatDecimal(item.precio,1,2)}">25.00</td>
            <td th:text="${#numbers.formatDecimal(item.precio,1,2)}">25.00</td>
        </tr>
        <tr th:if="${carrito.empty}">
            <td colspan="3" class="text-center">El carrito está vacío</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2" class="text-end">Total:</th>
            <th th:text="'S/ ' + ${#numbers.formatDecimal(total,1,2)}">S/ 0.00</th>
        </tr>
        </tfoot>
    </table>

    <a href="/menu" class="btn btn-secondary">Seguir comprando</a>
    <a href="/checkout" class="btn btn-success">Finalizar Compra</a>
</div>
</body>
</html>
